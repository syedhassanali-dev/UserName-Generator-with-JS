<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Username Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="body">
    <div id="container">
      <h1 id="heading">UserName Generator</h1>

      <div id="input-box-btn">
        <input
          id="input-box"
          type="text"
          placeholder="Enter Your Name Without Space"
        />
        <br />
        <button id="user-btn">Click here</button>
        <br />
        <input 
        id="output-box" 
        type="text" 
        placeholder="Your UserName" />
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
